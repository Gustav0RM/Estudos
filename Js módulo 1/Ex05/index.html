<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX05</title>
</head>
<body onload="SinalOperacao()">
  <h1>Calculadora</h1>
  
  <div class="container" style="margin:10px; display: inline;">
    <input type="number" name="primeiro_numero" id="primeiro_numero">
    <span id="enunciado2"></span>
    <input type="number" name="segundo_numero" id="segundo_numero">
  </div>

  <div class="container" style="margin:10px">
    <select name="select_operacao" id="select_operacao">
      <option value="1">Soma</option>
      <option value="2">Subtração</option>
      <option value="3">Divisão</option>
      <option value="4">Multiplicação</option>
      <option value="5">Potênciação</option>
    </select>
    <input id="botao" type="button" value="Calcular">
    <input id="botaoLimpar" type="button" value="Limpar">
  </div>

  <br><br>
  <label id="label" style="display: none;">Resultado</label>
  <input type="text" name="resultado" id="resultado" readonly style="display: none;">
  <input type="text" name="resultado2" id="resultado2" readonly style="display: none;">

<!-- 
                            !!PARA LEMBRAR!!
  .innerHTML é usado em elementos de conteúdo, por exemplo <div>, <p>, <span> 
  E .value é utilizado em elementos de formulário, <input>, <textarea>, <select>
-->


  <script>    
    function RealizarCalculo()
      {
      var select = document.getElementById('select_operacao');
      var option = document.getElementById('select_operacao').value;
      var botao = document.getElementById('botao');
      var primeiro_numero = Number(document.getElementById('primeiro_numero').value);
      var segundo_numero = Number(document.getElementById('segundo_numero').value);
      var resultado = document.getElementById('resultado');
      var resultado2 = document.getElementById('resultado2');
      var label = document.getElementById('label');
      resultado.style.display = '';
      resultado2.style.display = '';
      label.style.display = '';
      
      switch (option) 
        {
        case '1' : resultado.value = `${primeiro_numero + segundo_numero}`; break;
        case '2' : resultado.value = `${primeiro_numero - segundo_numero}`; break;
        case '3' : resultado.value = `${primeiro_numero / segundo_numero}`; break;
        case '4' : resultado.value = `${primeiro_numero * segundo_numero}`; break;
        case '5' : resultado.value = `${primeiro_numero ** segundo_numero}`; break;
        }
      }

    function ParOuImpar()
      {
      var resultado = Number(document.getElementById('resultado').value);
      var resultado2 = document.getElementById('resultado2');

      if ((resultado % 2) == 0)
        {
        resultado2.value = 'Par';
        }
      else
        {
        resultado2.value = 'Impar';  
        }
      }

    function LimparResultado()
      {
      var primeiro_numero = document.getElementById('primeiro_numero');
      var segundo_numero = document.getElementById('segundo_numero');
      var resultado = document.getElementById('resultado');
      var label = document.getElementById('label');

      primeiro_numero.value = '';  
      segundo_numero.value = '';
      resultado.value = '';
      resultado.style.display = 'none';
      resultado2.style.display = 'none';
      label.style.display = 'none';
      }
    function SinalOperacao()
      {
      let option = document.getElementById('select_operacao').value;
      let enunciado = document.getElementById('enunciado2');

      switch (option)
        {
        case '1' : enunciado.innerText = '+';  break;
        case '2' : enunciado.innerText = '-';  break;
        case '3' : enunciado.innerText = '/';  break;
        case '4' : enunciado.innerText = '*';  break;
        case '5' : enunciado.innerText = '**'; break;
        }
      }

    botao.addEventListener('click', RealizarCalculo);
    botaoLimpar.addEventListener('click', LimparResultado);
    botao.addEventListener('click', ParOuImpar);
    document.getElementById('select_operacao').addEventListener('change', SinalOperacao);
  </script>
</body>
</html>
